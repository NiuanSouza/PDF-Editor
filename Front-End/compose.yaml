name: pdf-editor-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-editor-frontend:latest
    container_name: pdf_editor_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  frontend_net:
    driver: bridge
